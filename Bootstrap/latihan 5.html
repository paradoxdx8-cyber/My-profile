<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Control</title>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    
    <div class="container mt-3 bg-success rounded-4">

        <h4 align="center" class="text-primary" >FORMULIR PENDAFTARAN SISWA BARU</h4>

        <div class="mb-3">
            <input type="text" placeholder="Masukkan NIPD" class="form-control">
        </div>

        <div class="mb-3">
            <input type="text" placeholder="Nama Lengkap" class="form-control">
        </div>

        <div class="mb-3">
            <input type="text" placeholder="Email" class="form-control">
        </div>

        <div class="mb-3">
            <textarea class="form-control" placeholder="Alamat Lengkap" row-10></textarea>
        </div>

        <div class="mb-3" form-foloating>
            <select class="form-select">
                <option>Rekayasa Perangkat Lunak</option>
                <option>Teknik komputer dan jaringan</option>
                <option>Desain komunikasi Visual</option>
                <option>Bisnis Digital</option>
                <option>Akuntansi</option>
            </select>
            <label>Pilih Jurusan</label>
        </div>

        <div class="mb-3">

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Natbinari</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Pramuka</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">PMR (Palang Merah Remaja)</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Osis</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">MPK</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Paskibra</label>


            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Pencak Silat</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Marcinenband</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Futsal</label>


            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Badminton</label>


            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">nari</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Voli</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Rohis</label>

        </div>

        <div class="mb-3">
            <div class="row">
                <div class="col-6">
                    <input class="form-check-input" type="radio" name="jk">
                    <label class="form-check-label">Laki-Laki</label>
                </div>
                <div class="col-6">
                    <input class="form-check-input" type="radio" name="jk">
                    <label class="form-check-label">Perempuan</label>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <div class="btn button btn-danger">Simpan Data</div>
            <button class="btn button btn-primary">Hapus Data</button>
        </div>
    </div>

</body>
</html>
